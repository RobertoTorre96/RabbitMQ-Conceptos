# Perfil tls (cap. 20): conexión cifrada al puerto 5671. Ejecutar desde la raíz del proyecto.
spring:
  rabbitmq:
    port: 5671
    ssl:
      enabled: true
      bundle: rabbit-tls
  ssl:
    bundle:
      pem:
        rabbit-tls:
          truststore:
            certificate: file:docker/certs/ca.pem
